server.port=8080
spring.application.name=Angavai Sangavai Bidding Platform(Ash)
app.storage.type=json
app.data.directory=data
spring.datasource.url=jdbc:mysql://localhost:3306/bidding_platform?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
app.cors.allowed-origins=*
app.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
app.cors.allowed-headers=*
logging.level.root=INFO
logging.level.com.angavai.bidding=DEBUG