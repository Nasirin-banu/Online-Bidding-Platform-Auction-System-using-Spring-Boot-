# Server Configuration
server.port=8080

# Application Name
spring.application.name=Angavai Sangavai Bidding Platform

# Storage Type: json or mysql
app.storage.type=json

# JSON Data Directory
app.data.directory=data

# MySQL Configuration (only used when app.storage.type=mysql)
spring.datasource.url=jdbc:mysql://localhost:3306/bidding_platform?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# CORS Configuration
app.cors.allowed-origins=*
app.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
app.cors.allowed-headers=*

# Logging
logging.level.root=INFO
logging.level.com.angavai.bidding=DEBUG
